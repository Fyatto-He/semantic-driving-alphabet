<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label inspector</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --panel: #f4f3f0; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --road: #e3e2de; --road-edge: #c9c8c2;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --panel: #232321; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --road: #2e2e2b; --road-edge: #3d3d39;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #232321; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --road: #2e2e2b; --road-edge: #3d3d39;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  select, button { font: inherit; color: var(--ink); background: var(--panel);
                   border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; min-width: 34px; }
  button:hover { border-color: var(--axis); }
  #verdict { font-weight: 600; }
  #story { flex-basis: 100%; color: var(--ink2); }
  #ruling { flex-basis: 100%; }
  #ruling b { font-weight: 600; }
  /* live state diagram of one automaton */
  #dfaWrap { margin: 12px 16px 0; }
  #dfaTabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #dfaTabs button { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 3px 9px;
                    background: var(--surface); line-height: 1.25; }
  #dfaTabs button span { font-size: 11px; color: var(--ink2); }
  #dfaTabs button.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  #dfaTabs button.bad span { color: var(--critical); font-weight: 700; }
  #dfaTabs button.good span { color: var(--good); font-weight: 700; }
  #dfaBody { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(240px, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 860px) { #dfaBody { grid-template-columns: 1fr; } }
  #dfa { width: 100%; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  #dfa .edge { fill: none; stroke: var(--axis); stroke-width: 1.2; }
  #dfa .edge.open { stroke: var(--ink2); stroke-width: 1.4; }
  #dfa .edge.taken { stroke: var(--ink); stroke-width: 2; }
  #dfa .edge.last { stroke: var(--s1); stroke-width: 3; }
  #dfa .ah.none { fill: var(--axis); } #dfa .ah.open { fill: var(--ink2); }
  #dfa .ah.taken { fill: var(--ink); } #dfa .ah.last { fill: var(--s1); }
  #dfa .elabel { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; }
  #dfa .elabel.taken, #dfa .elabel.last { fill: var(--ink2); }
  #dfa .elabel .yes { fill: var(--ink); font-weight: 700; }
  #dfa .elabel .no { fill: var(--muted); }
  #dfa .node { fill: var(--surface); stroke: var(--axis); stroke-width: 1.2; }
  #dfa .node.bad { stroke: var(--critical); stroke-dasharray: 4 3; }
  #dfa .node.good { stroke: var(--good); }
  #dfa .node.seen { stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: none; }
  #dfa .node.cur { fill: var(--ink); stroke: var(--ink); stroke-dasharray: none; }
  #dfa .node.cur.bad { fill: var(--critical); stroke: var(--critical); }
  #dfa .node.cur.good { fill: var(--good); stroke: var(--good); }
  #dfa .nlabel { font-size: 12px; fill: var(--ink2); }
  #dfa .nlabel.seen { fill: var(--ink); }
  #dfa .nlabel.cur { fill: var(--surface); font-weight: 700; }
  #dfa .nlabel.cur.bad, #dfa .nlabel.cur.good { fill: #ffffff; }
  #dfa .init { fill: var(--ink2); }
  #dfa .nact { font-size: 10.5px; fill: var(--ink2); }
  #dfa .nact.cur { fill: var(--surface); }
  #dfaInfo h3 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 8px 0 3px; font-weight: 600; }
  #dfaInfo h3:first-child { margin-top: 0; }
  #dfaInfo ul { margin: 0; padding-left: 16px; }
  #dfaInfo .yes { color: var(--ink); font-weight: 600; }
  #dfaInfo .no { color: var(--muted); }
  #dfaInfo .muted { color: var(--muted); list-style: none; margin-left: -16px; }
  #dfaPath a { cursor: pointer; white-space: nowrap; }
  #dfaPath a:hover { text-decoration: underline; }
  #dfaPath small { color: var(--muted); }
  #dfaKey { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 6px; color: var(--ink2); font-size: 12px; }
  #dfaKey span { display: inline-flex; align-items: center; gap: 5px; }
  #dfaKey i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink); }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 1fr); gap: 12px; padding: 0 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  /* the map stays in view while the right-hand column (which gets long when editing) scrolls */
  #mapWrap { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
             position: sticky; top: 8px; align-self: start; z-index: 1; }
  @media (max-width: 860px) { #mapWrap { position: static; } }
  #map { width: 100%; height: 400px; display: block; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-top: 1px solid var(--border); }
  #slider { flex: 1 1 160px; min-width: 120px; accent-color: var(--s1); }
  #clock { font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
  aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  .card h2 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  #now { font-variant-numeric: tabular-nums; }
  #changed { color: var(--ink2); min-height: 1.45em; }
  #chips { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--axis); display: inline-block; }
  .chip.on { color: var(--ink); font-weight: 600; }
  #why { margin: 0; padding-left: 16px; color: var(--ink2); }
  #why li { margin-bottom: 2px; }
  #phases { margin: 0; padding-left: 20px; }
  #phases li { padding: 1px 4px; border-left: 3px solid transparent; color: var(--ink2); }
  #phases li.cur { border-left-color: var(--ink); color: var(--ink); font-weight: 600; }
  #phases li.missed { color: var(--critical); }
  #phases .when { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; margin-right: 6px; }
  #notes { color: var(--ink2); margin: 6px 0 0; padding-left: 16px; }
  /* expectations: view and editor */
  #expBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  #expBar button:disabled { opacity: .4; cursor: default; }
  #phases small { color: var(--muted); font-weight: 400; }
  #phases small.missed { color: var(--critical); }
  #expEdit .phTime { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
  #expEdit .phTime input { width: 74px; font: inherit; font-size: 12px; color: var(--ink); background: var(--panel);
                           border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; }
  #expEdit .phTime a { cursor: pointer; text-decoration: underline; color: var(--ink); }
  #expEdit .adders { display: flex; flex-wrap: wrap; gap: 6px; }
  #saveNote { color: var(--ink2); }
  #vView { margin-top: 8px; color: var(--ink2); }
  #expEdit h3 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
  #expEdit .hint { color: var(--muted); margin: 0 0 8px; font-size: 12px; }
  #expEdit .ph { border: 1px solid var(--border); border-left: 3px solid var(--axis); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; background: var(--surface); }
  #expEdit .ph.cur { border-left-color: var(--ink); }
  #expEdit .phTop { display: flex; gap: 5px; align-items: center; }
  #expEdit .num { font-weight: 700; min-width: 16px; font-variant-numeric: tabular-nums; }
  #expEdit input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--panel);
                              border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
  #expEdit button { padding: 2px 7px; min-width: 26px; }
  #expEdit button:disabled { opacity: .35; cursor: default; }
  #expEdit .lits { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; align-items: center; }
  #expEdit .lit { display: inline-flex; align-items: center; border-radius: 11px; border: 1px solid var(--ink2); font-size: 12px; overflow: hidden; }
  #expEdit .lit a { cursor: pointer; padding: 1px 4px 1px 8px; user-select: none; }
  #expEdit .lit a.x { padding: 1px 7px 1px 3px; color: var(--muted); }
  #expEdit .lit a.x:hover { color: var(--critical); }
  #expEdit .lit i { font-style: normal; font-weight: 700; font-size: 10px; letter-spacing: .04em; margin-right: 4px; }
  #expEdit .lit.on { background: var(--panel); }
  #expEdit .lit.off { border-style: dashed; color: var(--ink2); }
  #expEdit select { font-size: 12px; padding: 1px 4px; }
  #expEdit .phFoot { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--ink2); }
  #expEdit .missed { color: var(--critical); }
  #expEdit .fitTag.yes { color: var(--ink); font-weight: 600; }
  #expEdit .fitTag.no { color: var(--muted); }
  #expEdit .nv { display: flex; gap: 6px; align-items: center; }
  #expEdit .nv .lits { flex: 1; }
  #expEdit .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 4px 0; }
  #expEdit label { display: inline-flex; gap: 4px; align-items: center; }
  #tlWrap { position: relative; margin: 12px 16px 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; }
  #tl { width: 100%; display: block; cursor: crosshair; }
  #tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
         border-radius: 6px; padding: 3px 7px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 10px 6px; color: var(--ink2); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
  kbd { font: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); }
</style>
</head>
<body>
<header>
  <h1>Label inspector</h1>
  <select id="runSel" aria-label="Run"></select>
  <span id="verdict"></span>
  <div id="story"></div>
  <div id="ruling"></div>
</header>
<main>
  <div id="mapWrap">
    <canvas id="map" aria-label="Top-down view of the junction at the selected time"></canvas>
    <div id="controls">
      <button id="bPrevChange" title="Previous label change (Shift+Left)">&#8676;</button>
      <button id="bPrev" title="One frame back (Left)">&#9664;</button>
      <button id="bPlay" title="Play / pause (Space)">&#9654;</button>
      <button id="bNext" title="One frame forward (Right)">&#9654;&#10072;</button>
      <button id="bNextChange" title="Next label change (Shift+Right)">&#8677;</button>
      <input id="slider" type="range" min="0" value="0" aria-label="Time">
      <span id="clock"></span>
    </div>
  </div>
  <aside>
    <div class="card"><h2>Now</h2><div id="now"></div><div id="changed"></div></div>
    <div class="card"><h2>Labels</h2><div id="chips"></div></div>
    <div class="card"><h2>Cars whose path may meet the ego's</h2><ul id="why"></ul></div>
    <div class="card" id="expCard">
      <h2>Expected for this run</h2>
      <div id="expBar">
        <button id="bEdit">Edit</button>
        <button id="bUndo" hidden title="Undo the last change (Ctrl+Z)">Undo</button>
        <button id="bRedo" hidden title="Redo the change just undone (Ctrl+Y)">Redo</button>
        <button id="bRevert" hidden title="Put this run back to how it was last saved">Revert this run</button>
        <button id="bSave" hidden>Save</button>
        <button id="bDiscard" hidden title="Put every run back to how it was last saved">Discard all changes</button>
        <span id="saveNote"></span>
      </div>
      <div id="expView"><ol id="phases"></ol><ul id="notes"></ul><div id="vView"></div></div>
      <div id="expEdit" hidden></div>
    </div>
  </aside>
</main>
<section id="dfaWrap" class="card">
  <h2>Automata: live state diagram (pick one)</h2>
  <div id="dfaTabs"></div>
  <div id="dfaBody">
    <div>
      <svg id="dfa" role="img" aria-label="State diagram of the selected automaton at the selected time"></svg>
      <div id="dfaKey">
        <span><i style="border-color:var(--s1);border-top-width:3px"></i>transition just taken</span>
        <span><i></i>taken earlier</span>
        <span><i style="border-color:var(--ink2);border-top-width:1.4px"></i>possible from the current state</span>
        <span><i style="border-color:var(--axis);border-top-width:1.2px"></i>not reached</span>
      </div>
    </div>
    <div id="dfaInfo"></div>
  </div>
</section>
<div id="tlWrap">
  <div class="legend" id="legend"></div>
  <canvas id="tl" aria-label="Timeline of every label over the run"></canvas>
  <div id="tip"></div>
</div>
<script>
const DATA = /*DATA*/null;
const P = DATA.props, GROUPS = DATA.groups, A = DATA.automata;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const groupColor = g => css('--s' + (GROUPS.indexOf(g) + 1));
const on = (bits, k) => (bits >> k) & 1;
let run, frame = 0, timer = null;

const sel = $('runSel');
let lastScenario = null, og = null;
DATA.runs.forEach((r, i) => {
  if (r.scenario !== lastScenario) { og = document.createElement('optgroup'); og.label = r.scenario; sel.appendChild(og); lastScenario = r.scenario; }
  const o = document.createElement('option');
  o.value = i;
  og.appendChild(o);
});
function refreshOptions() {       // the mark after each run: its label sequence, or a cross if the automata's verdict is unexpected
  const mark = {match: '✓', 'match*': '≈', timing: '◷', MISMATCH: '✗', none: '—'};
  [...sel.options].forEach(o => {
    const r = DATA.runs[+o.value], changed = JSON.stringify(EXP[r.key]) !== JSON.stringify(SAVED[r.key]);
    o.textContent = r.variant + '  /  ' + r.driver + '   ' + (r.spec.as_expected ? mark[r.verdict] : '✗') + (changed ? '   (edited)' : '');
  });
}

// ---- expectations: a working copy that is checked in the page and can be edited ----------
const clone = x => JSON.parse(JSON.stringify(x));
const esc = s => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const EXP = {};                               // run key -> the expectation as it is being edited
DATA.runs.forEach(r => EXP[r.key] = clone(r.expect));
let SAVED = clone(EXP);                       // as loaded or last saved
let editing = false, SERVER = false, note = '';
const LOCAL = 'semalpha-expectation-edits';   // unsaved edits survive a reload of the same page
try {
  const kept = JSON.parse(localStorage.getItem(LOCAL) || 'null');
  if (kept && kept.stamp === DATA.stamp) {
    Object.keys(EXP).forEach(k => { if (kept.exp[k]) EXP[k] = kept.exp[k]; });
    if (JSON.stringify(EXP) !== JSON.stringify(SAVED)) note = 'Unsaved edits from your last visit were restored.';
  }
} catch (e) {}
function keepLocal() {
  try {
    if (JSON.stringify(EXP) === JSON.stringify(SAVED)) localStorage.removeItem(LOCAL);
    else localStorage.setItem(LOCAL, JSON.stringify({stamp: DATA.stamp, exp: EXP}));
  } catch (e) {}
}
const fits = (bits, literals) => literals.split(' ').filter(Boolean).every(lit => litHolds(lit, bits));

// The same check as label.py: walk the frames through the phases in order.
function evaluate(r) {
  const e = EXP[r.key], ph = e.phases, n = ph.length, blank = !n && !e.never.some(c => c.trim());
  const reached = new Array(n).fill(null), phase = [], unexplained = [];
  let i = -1;
  r.labels.forEach((bits, f) => {
    if (blank) { phase.push(-1); return; }
    let nxt = i + 1;                  // the next phase, or a later one if every phase skipped is optional
    while (nxt < n && !fits(bits, ph[nxt].labels) && ph[nxt].optional) nxt++;
    if (nxt < n && fits(bits, ph[nxt].labels)) { i = nxt; reached[i] = r.t[f]; phase.push(i); }
    else if (i >= 0 && fits(bits, ph[i].labels)) phase.push(i);
    else {
      phase.push(-1);
      const t = r.t[f], u = unexplained[unexplained.length - 1];
      if (u && Math.abs(u[1] - t) < 1.5 * DATA.dt) u[1] = t + DATA.dt; else unexplained.push([t, t + DATA.dt]);
    }
  });
  const violations = [];
  e.never.forEach(combo => {
    if (!combo.trim()) return;
    const hits = r.labels.map((b, f) => fits(b, combo) ? f : -1).filter(f => f >= 0);
    if (hits.length) violations.push([combo, r.t[hits[0]], hits.length * DATA.dt]);
  });
  const missed = ph.some((p, k) => !p.optional && reached[k] === null);
  // a phase that was given a time must be reached within the tolerance of it
  const timing = [];
  ph.forEach((p, k) => { if (p.at != null && reached[k] !== null && Math.abs(reached[k] - p.at) > DATA.tolerance + 1e-9) timing.push([k, p.at, reached[k]]); });
  r.verdict = blank ? 'none' : (missed || violations.length) ? 'MISMATCH' : timing.length ? 'timing' : unexplained.length ? 'match*' : 'match';
  r.phases = ph.map((p, k) => ({name: p.name, literals: p.labels, optional: p.optional, at: p.at == null ? null : p.at, t: reached[k]}));
  r.timing = timing;
  r.unexplained = unexplained; r.violations = violations; r.phase = phase;
  const v = e.verdict, got = r.spec.violations.map(x => x[0]);
  r.spec.as_expected = v.completed === r.spec.completed && v.waited === r.spec.waited
    && v.violations.length === got.length && v.violations.every(x => got.includes(x));
  r.spec.expected = `${v.completed ? 'reaches the destination' : 'does not reach the destination'}; rules broken: ${v.violations.join(', ') || 'none'}; halted: ${v.waited.replace('_', ' ')}`;
}

// Compare this page's check with the one done by label.py / verify.py on the saved expectations.
function selfCheck() {
  const differ = [];
  DATA.runs.forEach(r => {
    const mine = EXP[r.key]; EXP[r.key] = clone(r.expect); evaluate(r);
    const seconds = r.unexplained.reduce((s, u) => s + u[1] - u[0], 0);
    const sameTimes = r.phases.length === r.py.reached.length && r.phases.every((p, k) =>
      (p.t === null) === (r.py.reached[k] === null) && (p.t === null || Math.abs(p.t - r.py.reached[k]) < 0.06));
    if (r.verdict !== r.py.verdict || !sameTimes || Math.abs(seconds - r.py.unexplained_s) > 0.06
        || r.violations.length !== r.py.forbidden || r.timing.length !== r.py.timing
        || r.spec.as_expected !== r.py.as_expected) differ.push(r.key);
    EXP[r.key] = mine; evaluate(r);
  });
  return differ;
}
$('legend').innerHTML = GROUPS.map(g => `<span><i style="background:${groupColor(g)}"></i>${g}</span>`).join('')
  + '<span style="margin-left:auto"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> step &nbsp; <kbd>Shift</kbd>+arrow: jump to a label change &nbsp; <kbd>Space</kbd> play</span>';

function selectRun(i) {
  run = DATA.runs[i]; frame = 0; stop();
  $('slider').max = run.t.length - 1;
  $('story').textContent = run.story + (run.why_driver ? '  Driver: ' + run.why_driver : '');
  pickAutomata();
  renderExpectation();
  show();
}

// Everything that depends on the expectation of the selected run: header lines and the card.
const offBy = p => (p.at == null || p.t === null) ? '' : Math.abs(p.t - p.at) < 0.05 ? 'on time'
  : `${Math.abs(p.t - p.at).toFixed(1)} s ${p.t > p.at ? 'later' : 'earlier'} than expected`;
const isOff = p => p.at != null && p.t !== null && Math.abs(p.t - p.at) > DATA.tolerance + 1e-9;

function renderExpectation() {
  const text = {match: '✓ labels match the expected sequence',
                'match*': '≈ labels reach every milestone, with stretches the expectation does not explain',
                timing: '◷ labels follow the expected sequence, but a phase begins earlier or later than the time given for it',
                MISMATCH: '✗ labels differ from the expected sequence',
                none: '— no expected sequence has been written for this run yet'}[run.verdict];
  $('verdict').textContent = text;
  $('verdict').style.color = run.verdict === 'MISMATCH' ? css('--critical') : css('--ink');
  const sp = run.spec;
  const broken = sp.violations.length ? sp.violations.map(v => `<b>${v[0]}</b> at ${v[1].toFixed(1)} s`).join(', ') : 'none';
  $('ruling').innerHTML = `Automata: ${sp.completed ? '✓ reached the destination' : '✗ did not reach the destination (got as far as: ' + sp.progress + ')'}`
    + ` &middot; rules broken: ${broken} &middot; halted: <b>${sp.waited.replace('_', ' ')}</b> &middot; idle while free: ${sp.idle.toFixed(1)} s`
    + ` &middot; ${sp.as_expected ? '✓ the verdict expected for this run' : '✗ expected: ' + sp.expected}`;
  const m = run.measured;      // controller runs only: facts taken from positions and speeds, not from labels
  if (m) $('ruling').innerHTML += `<br>Measured from positions: ${m.collided ? '<b>✗ collision</b>' : '✓ no collision'}`
    + ` &middot; closest car: ${m.closest === null ? 'none on the map' : m.closest.toFixed(1) + ' m'}`
    + ` &middot; took ${m.duration.toFixed(1)} s (the simulator's own driver in the same traffic: ${m.reference_duration.toFixed(1)} s)`
    + ` &middot; ${m.cut_off.length ? '<b>✗ cut off: ' + m.cut_off.join(', ') + '</b>' : '✓ cut nobody off'}`;
  $('expView').hidden = editing; $('expEdit').hidden = !editing;
  if (editing) renderEditor();
  else {
    $('phases').innerHTML = run.phases.map((p, k) => {
      const when = p.t === null ? (p.optional ? 'skipped' : 'never') : p.t.toFixed(1) + ' s';
      const want = p.at == null ? '' : ` <small class="${isOff(p) ? 'missed' : ''}">(expected at ${p.at.toFixed(1)} s${p.t === null ? '' : ': ' + offBy(p)})</small>`;
      return `<li data-k="${k}" class="${p.t === null && !p.optional ? 'missed' : ''}" title="${esc(p.literals)}"><span class="when">${when}</span>${p.optional ? '(' + esc(p.name) + ')' : esc(p.name)}${want}</li>`;
    }).join('') || '<li style="list-style:none;margin-left:-20px;color:var(--muted)">Nothing written yet. Click Edit to describe what this run should show.</li>';
    $('notes').innerHTML = run.unexplained.map(u => `<li>⚠ ${u[0].toFixed(1)}&ndash;${u[1].toFixed(1)} s: labels fit neither the current nor the next expected phase</li>`)
      .concat(run.timing.map(x => `<li>⚠ phase ${x[0] + 1} is reached at ${x[2].toFixed(1)} s, but was expected at ${x[1].toFixed(1)} s (allowed: ${DATA.tolerance} s either way)</li>`))
      .concat(run.violations.map(v => `<li>✗ from ${v[1].toFixed(1)} s for ${v[2].toFixed(1)} s: a combination expected never to occur [${esc(v[0])}]</li>`)).join('');
    $('vView').innerHTML = `Expected verdict: ${sp.expected}.`;
  }
  updateBar();
  markNow();
}

function updateBar() {
  const changed = Object.keys(EXP).filter(k => JSON.stringify(EXP[k]) !== JSON.stringify(SAVED[k])).length;
  $('bEdit').textContent = editing ? 'Done editing' : 'Edit';
  $('bUndo').hidden = $('bRedo').hidden = !editing;
  $('bUndo').disabled = !HISTORY.length; $('bRedo').disabled = !FUTURE.length;
  $('bRevert').hidden = JSON.stringify(EXP[run.key]) === JSON.stringify(SAVED[run.key]);
  $('bSave').hidden = $('bDiscard').hidden = !changed;
  $('bSave').textContent = SERVER ? 'Save' : 'Download expectations.json';
  $('saveNote').textContent = (changed ? `${changed} run${changed > 1 ? 's' : ''} changed, not saved. ` : '') + note;
}

// What depends on the selected moment: the phase the run is in, and which phases fit right now.
function markNow() {
  const bits = run.labels[frame], cur = run.phase[frame];
  document.querySelectorAll('#phases li').forEach(li => li.classList.toggle('cur', +li.dataset.k === cur));
  if (!editing) return;
  document.querySelectorAll('#expEdit .nowT').forEach(el => el.textContent = run.t[frame].toFixed(1));
  document.querySelectorAll('#expEdit .ph').forEach(div => {
    const k = +div.dataset.k, ok = fits(bits, EXP[run.key].phases[k].labels), tag = div.querySelector('.fitTag');
    div.classList.toggle('cur', k === cur);
    tag.textContent = ok ? '✓ fits the selected moment' : '✗ does not fit the selected moment';
    tag.className = 'fitTag ' + (ok ? 'yes' : 'no');
  });
}

// ---- undo and redo -----------------------------------------------------------------------
// Each step is the whole set of expectations as text. Typing in one box, or dragging one
// marker, counts as a single step.
let HISTORY = [], FUTURE = [], lastState = JSON.stringify(EXP), lastKind = '';
function remember(kind) {
  const now = JSON.stringify(EXP);
  if (now === lastState) return;
  if (!(kind && kind === lastKind)) { HISTORY.push(lastState); if (HISTORY.length > 200) HISTORY.shift(); }
  FUTURE = []; lastState = now; lastKind = kind || '';
}
function restore(state) {
  const data = JSON.parse(state);
  Object.keys(EXP).forEach(k => EXP[k] = data[k]);
  lastState = state; lastKind = ''; note = '';
  keepLocal(); DATA.runs.forEach(evaluate); refreshOptions(); renderExpectation(); show();
}
function undo() { if (HISTORY.length) { FUTURE.push(lastState); restore(HISTORY.pop()); } }
function redo() { if (FUTURE.length) { HISTORY.push(lastState); restore(FUTURE.pop()); } }

// ---- the editor --------------------------------------------------------------------------
// A list of labels, each required on or off. `where` names the list: p3 = phase 4, n0 = first 'never'.
function litChips(labels, where) {
  const lits = labels.split(' ').filter(Boolean), used = new Set(lits.map(l => l.replace('!', '')));
  return `<div class="lits">` + lits.map((lit, q) => {
      const off = lit.startsWith('!');
      return `<span class="lit ${off ? 'off' : 'on'}"><a data-act="flip" data-where="${where}" data-q="${q}" title="Click to switch between must be on and must be off"><i>${off ? 'OFF' : 'ON'}</i>${lit.replace('!', '')}</a>`
           + `<a class="x" data-act="drop" data-where="${where}" data-q="${q}" title="Remove from this list">×</a></span>`; }).join('')
    + `<select data-act="add" data-where="${where}" title="Add a label. It starts with the value it has at the selected moment."><option value="">+ label…</option>`
    + P.filter(p => !used.has(p.name)).map(p => `<option>${p.name}</option>`).join('') + `</select></div>`;
}

function renderEditor() {
  const e = EXP[run.key], last = e.phases.length - 1, t0 = run.t[0], t1 = run.t[run.t.length - 1];
  const phases = e.phases.map((p, k) => {
    const rp = run.phases[k], t = rp.t;
    const reach = t !== null
      ? `labels reach it at <a data-act="seek" data-t="${t}" title="Go to this moment">${t.toFixed(1)} s</a>` + (p.at == null ? '' : `: <span class="${isOff(rp) ? 'missed' : ''}">${offBy(rp)}</span>`)
      : p.optional ? 'skipped in this run' : '<b class="missed">never reached in this run</b>';
    return `<div class="ph" data-k="${k}">
      <div class="phTop"><span class="num">${k + 1}</span>
        <input type="text" data-act="name" data-k="${k}" value="${esc(p.name)}" placeholder="The situation, in words" aria-label="Description of phase ${k + 1}">
        <button data-act="insert" data-k="${k}" title="Insert a new phase before this one">+</button>
        <button data-act="up" data-k="${k}" title="Move earlier" ${k ? '' : 'disabled'}>↑</button>
        <button data-act="down" data-k="${k}" title="Move later" ${k < last ? '' : 'disabled'}>↓</button>
        <button data-act="del" data-k="${k}" title="Delete this phase">✕</button></div>
      <div class="phTime"><label>begins at <input type="number" data-act="at" data-k="${k}" step="0.1" min="${t0}" max="${t1}" value="${p.at == null ? '' : p.at}" placeholder="any time" aria-label="Expected start of phase ${k + 1}, in seconds"> s</label>
        <button data-act="atNow" data-k="${k}" title="Set the expected start to the selected moment">use <span class="nowT"></span> s</button>
        ${p.at == null ? '' : `<button data-act="atClear" data-k="${k}" title="Remove the expected start time">clear</button>`}
        <span>${reach}</span></div>
      ${litChips(p.labels, 'p' + k)}
      <div class="phFoot"><label><input type="checkbox" data-act="opt" data-k="${k}" ${p.optional ? 'checked' : ''}> may be skipped</label><span class="fitTag"></span></div>
    </div>`; }).join('');
  const never = e.never.map((c, k) => `<div class="nv">${litChips(c, 'n' + k)}<button data-act="delNever" data-k="${k}" title="Delete this combination">✕</button></div>`).join('');
  const v = e.verdict, sp = run.spec;
  $('expEdit').innerHTML =
      `<p class="hint">Move the time slider to the moment something changes, then add a phase there. Give it the labels that must be ON or OFF: a new label starts with the value it has at that moment, and a click flips it. Labels you leave out may be anything. A phase with a start time is also checked for when the labels reach it (allowed: ${DATA.tolerance} s either way); on the timeline its marker ▼ can be dragged.</p>`
    + phases
    + `<div class="adders"><button data-act="addHere" title="Add a phase that begins at the selected moment; it is put in the right place in the order">+ Add a phase at <span class="nowT"></span> s</button>`
    + `<button data-act="addPhase" title="Add a phase with no start time after the last one">+ Add a phase at the end</button></div>`
    + `<h3>Must never happen</h3><p class="hint">Combinations of labels that must not occur at any moment of this run.</p>`
    + never + `<button data-act="addNever">+ Add a combination</button>`
    + `<h3>Expected verdict of the automata</h3>`
    + `<div class="row"><label><input type="checkbox" data-act="vdone" ${v.completed ? 'checked' : ''}> reaches the destination</label></div>`
    + `<div class="row">breaks:` + DATA.rules.map(r => `<label><input type="checkbox" data-act="vrule" data-rule="${r}" ${v.violations.includes(r) ? 'checked' : ''}> ${r}</label>`).join('') + `</div>`
    + `<div class="row"><label>comes to a halt: <select data-act="vwait">` + DATA.halts.map(h => `<option value="${h}" ${h === v.waited ? 'selected' : ''}>${h.replace('_', ' ')}</option>`).join('') + `</select></label></div>`
    + `<div class="row">${sp.as_expected ? '✓ This is what the automata found.' : '✗ The automata found something else: ' + (sp.completed ? 'reaches the destination' : 'does not reach the destination') + '; rules broken: ' + (sp.violations.map(x => x[0]).join(', ') || 'none') + '; halted: ' + sp.waited.replace('_', ' ') + '.'}</div>`;
}

const getLits = where => where[0] === 'p' ? EXP[run.key].phases[+where.slice(1)].labels : EXP[run.key].never[+where.slice(1)];
function setLits(where, text) {
  if (where[0] === 'p') EXP[run.key].phases[+where.slice(1)].labels = text; else EXP[run.key].never[+where.slice(1)] = text;
}
// When a phase happens: the time written for it, otherwise the time the labels reach it.
const timeOf = k => { const p = EXP[run.key].phases[k]; return p.at != null ? p.at : (run.phases[k] ? run.phases[k].t : null); };
// Move phase k to where its start time belongs, so the list stays in time order. Returns its new place.
function placeByTime(k) {
  const list = EXP[run.key].phases, p = list[k];
  if (p.at == null) return k;
  const times = list.map((_, j) => timeOf(j));
  list.splice(k, 1); times.splice(k, 1);
  let pos = times.findIndex(t => t !== null && t > p.at);
  if (pos < 0) pos = list.length;
  list.splice(pos, 0, p);
  return pos;
}
const clampTime = t => Math.round(Math.min(Math.max(t, run.t[0]), run.t[run.t.length - 1]) * 10) / 10;

function edited(redraw = true, kind = '') {   // after any change: remember it, re-check, refresh
  note = ''; remember(kind);
  evaluate(run); keepLocal(); refreshOptions();
  if (redraw) renderExpectation(); else updateBar();
  show();
}
$('expEdit').addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  const e = EXP[run.key], act = t.dataset.act, k = +t.dataset.k;
  if (act === 'seek') { stop(); go(run.t.indexOf(+t.dataset.t)); return; }
  if (act === 'flip' || act === 'drop') {
    const lits = getLits(t.dataset.where).split(' ').filter(Boolean), q = +t.dataset.q;
    if (act === 'flip') lits[q] = lits[q].startsWith('!') ? lits[q].slice(1) : '!' + lits[q]; else lits.splice(q, 1);
    setLits(t.dataset.where, lits.join(' '));
  }
  else if (act === 'up' && k > 0) [e.phases[k - 1], e.phases[k]] = [e.phases[k], e.phases[k - 1]];
  else if (act === 'down' && k < e.phases.length - 1) [e.phases[k + 1], e.phases[k]] = [e.phases[k], e.phases[k + 1]];
  else if (act === 'del') e.phases.splice(k, 1);
  else if (act === 'insert') e.phases.splice(k, 0, {name: '', labels: '', optional: false});
  else if (act === 'addPhase') e.phases.push({name: '', labels: '', optional: false});
  else if (act === 'addHere') { e.phases.push({name: '', labels: '', optional: false, at: run.t[frame]}); placeByTime(e.phases.length - 1); }
  else if (act === 'atNow') { e.phases[k].at = run.t[frame]; placeByTime(k); }
  else if (act === 'atClear') delete e.phases[k].at;
  else if (act === 'addNever') e.never.push('');
  else if (act === 'delNever') e.never.splice(k, 1);
  else return;
  edited();
});
$('expEdit').addEventListener('change', ev => {
  const t = ev.target, e = EXP[run.key], act = t.dataset.act;
  if (act === 'add' && t.value) {          // a new label takes the value it has at the selected moment
    const lit = on(run.labels[frame], pIndex[t.value]) ? t.value : '!' + t.value;
    setLits(t.dataset.where, (getLits(t.dataset.where) + ' ' + lit).trim());
  }
  else if (act === 'at') {
    const k = +t.dataset.k, value = parseFloat(t.value);
    if (isNaN(value)) delete e.phases[k].at; else { e.phases[k].at = clampTime(value); placeByTime(k); }
  }
  else if (act === 'opt') e.phases[+t.dataset.k].optional = t.checked;
  else if (act === 'vdone') e.verdict.completed = t.checked;
  else if (act === 'vrule') e.verdict.violations = DATA.rules.filter(r => r === t.dataset.rule ? t.checked : e.verdict.violations.includes(r));
  else if (act === 'vwait') e.verdict.waited = t.value;
  else return;
  edited();
});
$('expEdit').addEventListener('input', ev => {
  const t = ev.target;                     // typing a description: no redraw, so the cursor stays in the box
  if (t.dataset.act === 'name') { EXP[run.key].phases[+t.dataset.k].name = t.value; edited(false, 'name:' + run.key + ':' + t.dataset.k); }
});

function tidy() {                          // what gets saved: no empty rows, no nameless phases, no empty times
  const out = clone(EXP);
  Object.values(out).forEach(e => {
    e.never = e.never.filter(c => c.trim());
    e.phases.forEach(p => { p.name = p.name.trim() || 'unnamed phase'; if (p.at == null) delete p.at; });
  });
  return out;
}
async function save() {
  const data = tidy();
  if (SERVER) {
    try {
      const res = await fetch('api/expectations', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
      const answer = await res.json();
      if (!res.ok || !answer.ok) throw new Error(answer.error || 'HTTP ' + res.status);
      Object.keys(data).forEach(k => EXP[k] = data[k]);
      SAVED = clone(EXP); DATA.stamp = answer.stamp;
      lastState = JSON.stringify(EXP); lastKind = '';
      note = 'Saved to semalpha/expectations.json.';
    } catch (err) { note = 'Not saved: ' + err.message; }
  } else {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], {type: 'application/json'}));
    link.download = 'expectations.json'; link.click(); URL.revokeObjectURL(link.href);
    note = 'Downloaded. Replace semalpha/expectations.json with that file to keep the changes.';
  }
  keepLocal(); DATA.runs.forEach(evaluate); refreshOptions(); renderExpectation(); show();
}
$('bEdit').onclick = () => { editing = !editing; renderExpectation(); show(); };
$('bUndo').onclick = undo;
$('bRedo').onclick = redo;
$('bSave').onclick = save;
$('bRevert').onclick = () => { EXP[run.key] = clone(SAVED[run.key]); edited(); note = 'This run is back to how it was saved. Undo brings your changes back.'; updateBar(); };
$('bDiscard').onclick = () => {
  Object.keys(EXP).forEach(k => EXP[k] = clone(SAVED[k]));
  remember('');
  note = 'All changes discarded. Undo brings them back.';
  keepLocal(); DATA.runs.forEach(evaluate); refreshOptions(); renderExpectation(); show();
};

function show() {
  $('slider').value = frame;
  $('clock').textContent = run.t[frame].toFixed(1) + ' s';
  const [speed, dist, signal] = run.ego[frame];
  const where = dist === null ? 'past the junction' : dist >= 0 ? dist.toFixed(1) + ' m before the entry line' : (-dist).toFixed(1) + ' m past the entry line';
  $('now').innerHTML = `ego speed <b>${speed.toFixed(1)} m/s</b> &middot; front bumper <b>${where}</b>` + (signal ? ` &middot; signal <b>${signal}</b>` : '');
  const bits = run.labels[frame], prev = frame > 0 ? run.labels[frame - 1] : bits;
  const delta = P.map((p, k) => on(bits, k) === on(prev, k) ? '' : (on(bits, k) ? '+' : '−') + p.name).filter(Boolean);
  $('changed').textContent = delta.length ? 'changed at this frame: ' + delta.join('  ') : '';
  $('chips').innerHTML = P.map((p, k) => {
    const o = on(bits, k), c = groupColor(p.group);
    return `<span class="chip ${o ? 'on' : ''}" title="${p.doc}"><i style="${o ? `background:${c};border-color:${c}` : ''}"></i>${p.name}</span>`;
  }).join('');
  const why = run.why[frame];
  $('why').innerHTML = why.length ? why.map(w => `<li>${w}</li>`).join('') : '<li style="list-style:none;margin-left:-16px;color:var(--muted)">none at this moment</li>';
  markNow();
  drawMap(); drawDfa(); drawTimeline();
}

function prep(canvas, h) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth;
  if (h) canvas.style.height = h + 'px';
  const hh = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(hh * dpr);
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, hh);
  return [g, w, hh];
}

function drawMap() {
  const [g, w, h] = prep($('map'));
  const [x0, y0, x1, y1] = run.window, sc = Math.min(w / (x1 - x0), h / (y1 - y0));
  const ox = (w - sc * (x1 - x0)) / 2, oy = (h - sc * (y1 - y0)) / 2;
  const X = x => ox + (x - x0) * sc, Y = y => h - oy - (y - y0) * sc;
  const poly = pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); };
  const map = DATA.maps[run.map];
  g.fillStyle = css('--road'); g.strokeStyle = css('--road-edge'); g.lineWidth = 0.5;
  map.lanes.forEach(l => { poly(l); g.closePath(); g.fill(); g.stroke(); });
  map.junctions.forEach(j => { poly(j); g.closePath(); g.fill(); });
  g.strokeStyle = css('--s1'); g.globalAlpha = 0.35; g.lineWidth = 2; g.setLineDash([6, 5]); poly(run.route); g.stroke();
  g.setLineDash([]); g.globalAlpha = 1;
  g.strokeStyle = css('--ink'); g.lineWidth = 2.5; poly(run.entry_line); g.stroke();
  const bits = run.labels[frame], crash = on(bits, P.findIndex(p => p.name === 'collision'));
  g.font = '11px system-ui, sans-serif'; g.textAlign = 'center';
  run.frames[frame].forEach(v => {
    const [ci, x, y, yaw, len, wid] = v, ego = run.cars[ci] === 'ego';
    g.save(); g.translate(X(x), Y(y)); g.rotate(-yaw);
    g.fillStyle = ego ? css('--s1') : css('--s2');
    g.beginPath(); g.roundRect(-len / 2 * sc, -wid / 2 * sc, len * sc, wid * sc, 2); g.fill();
    if (ego && crash) { g.strokeStyle = css('--critical'); g.lineWidth = 2.5; g.stroke(); }
    g.fillStyle = css('--surface'); g.globalAlpha = 0.75;
    g.fillRect((len / 2 - 0.7) * sc, -wid / 2 * sc + 1, 0.45 * sc, wid * sc - 2);   // windscreen: shows which way it faces
    g.restore();
    g.fillStyle = css('--ink2'); g.fillText(run.cars[ci], X(x), Y(y) - wid * sc / 2 - 6);
  });
}

// ---- live state diagram ------------------------------------------------------------------
// The automata shown for the selected run: the controller that drove it, if one did, then the rule set.
let AUT = A, SEQ = [], focus = 0, focusName = 'respect_right_of_way';
function pickAutomata() {
  AUT = run.controller ? [DATA.controllers[run.controller], ...A] : A;
  SEQ = run.controller ? [run.ctrl, ...run.auto] : run.auto;
  focus = run.controller ? 0 : Math.max(0, AUT.findIndex(a => a.name === focusName));
}
const pIndex = Object.fromEntries(P.map((p, k) => [p.name, k]));
const spaced = s => s.replace(/_/g, ' ');
const litText = lit => lit.startsWith('!') ? '¬' + lit.slice(1) : lit;
const litHolds = (lit, bits) => lit.startsWith('!') ? !on(bits, pIndex[lit.slice(1)]) : !!on(bits, pIndex[lit]);
function wrapLiterals(cond, maxChars) {       // a condition -> lines, each a list of literals
  const lines = [[]]; let len = 0;
  cond.split(' ').forEach(lit => {
    if (len + lit.length + 3 > maxChars && lines[lines.length - 1].length) { lines.push([]); len = 0; }
    lines[lines.length - 1].push(lit); len += lit.length + 3;
  });
  return lines;
}

function drawDfa() {
  const a = AUT[focus], seq = SEQ[focus], cur = seq[frame], bits = run.labels[frame], names = a.states;
  const act = st => a.actions ? spaced(a.actions[st]) : '';      // what the car does in a state (controllers only)
  const isBad = s => a.bad.includes(s), isGood = s => a.good.includes(s);

  // tabs: every automaton with its state now; the selected one is drawn below
  $('dfaTabs').innerHTML = AUT.map((b, k) => {
    const s = b.states[SEQ[k][frame]];
    const cls = b.bad.includes(s) ? 'bad' : b.good.includes(s) ? 'good' : '';
    if (b.actions) return `<button class="${k === focus ? 'sel' : ''}" data-k="${k}" title="${b.rule}">controller: ${b.name}<span>${spaced(s)} → ${spaced(b.actions[s])}</span></button>`;
    return `<button class="${k === focus ? 'sel ' : ''}${cls}" data-k="${k}" title="${b.rule}">${b.name}<span>${cls === 'bad' ? '✗ ' : cls === 'good' ? '✓ ' : ''}${spaced(s)}</span></button>`;
  }).join('');

  // the flow so far: every change of state up to the selected frame
  const taken = [], visited = new Set([0]);
  let prev = 0, last = null;
  for (let i = 0; i <= frame; i++) if (seq[i] !== prev) { last = [prev, seq[i], run.t[i]]; taken.push(last); visited.add(seq[i]); prev = seq[i]; }

  // edges, merged per ordered pair of states
  const groups = new Map();
  Object.entries(a.transitions).forEach(([from, moves]) => moves.forEach(([cond, to]) => {
    const key = from + '>' + to;
    if (!groups.has(key)) groups.set(key, {from, to, conds: []});
    groups.get(key).conds.push(cond);
  }));
  const edges = [...groups.values()].filter(e => e.from !== e.to);   // "stay while ..." is listed beside the diagram, not drawn
  const main = names.filter(s => !isBad(s)), bad = names.filter(isBad);
  const svg = $('dfa'), NH = a.actions ? 42 : 30, LH = 12.5;
  const nodeW = s => Math.max(62, Math.max(s.length, a.actions ? act(s).length + 3 : 0) * 7.2 + 26);
  const widths = main.reduce((sum, s) => sum + nodeW(s), 0);
  const W = Math.max(440, svg.clientWidth || 640, widths + 52 + 30 * Math.max(1, main.length - 1));
  // a label line is either plain text or a list of labels that must be on or off
  edges.forEach(e => {
    e.lines = [];
    if (e.conds.length > 2) e.lines.push({text: `any of ${e.conds.length} reasons`, any: true});
    else e.conds.forEach((c, k) => {
      if (k) e.lines.push({text: 'or'});
      if (!c.trim()) e.lines.push({text: 'otherwise'}); else wrapLiterals(c, 30).forEach(l => e.lines.push({lits: l}));
    });
    const i = main.indexOf(e.from), j = main.indexOf(e.to);
    e.kind = j < 0 ? 'down' : j > i ? 'fwd' : 'back';
    e.span = Math.abs(j - i);
    if (e.kind === 'fwd') e.h = (e.span === 1 && !groups.has(e.to + '>' + e.from)) ? 0 : 24 + 30 * (e.span - 1);
  });
  // Arcs going back: below the row when that space is free. If the automaton has a `violated`
  // state, the space below belongs to the edges leading to it, so those arcs go above instead,
  // higher than the forward arcs and their labels.
  const backOnTop = bad.length > 0;
  const fwdLines = Math.max(0, ...edges.filter(e => e.kind === 'fwd' && e.h > 0).map(e => e.lines.length));
  edges.forEach(e => {
    if (e.kind === 'back') e.h = backOnTop ? 24 + 30 * (e.span - 1) + fwdLines * LH + 16 : 28 + 28 * (e.span - 1);
  });
  const reach = e => e.h + e.lines.length * LH + 8;
  const above = Math.max(0, ...edges.filter(e => e.kind === 'fwd' || (backOnTop && e.kind === 'back')).map(reach));
  const below = backOnTop ? 0 : Math.max(0, ...edges.filter(e => e.kind === 'back').map(e => reach(e) + 2));
  const yMain = 14 + above + NH / 2;
  const yBad = yMain + NH + Math.max(below + 30, 104);
  const H = (bad.length ? yBad + NH / 2 : yMain + NH / 2 + below) + 14;
  const pos = {}, spare = (W - 52 - widths) / Math.max(1, main.length - 1);
  let left = 36;                                   // boxes side by side with equal gaps, whatever their widths
  main.forEach(s => { pos[s] = [main.length === 1 ? W / 2 : left + nodeW(s) / 2, yMain]; left += nodeW(s) + spare; });
  bad.forEach((s, i) => pos[s] = [W / 2 + (i - (bad.length - 1) / 2) * 190, yBad]);

  const edgeClass = e => {
    const f = names.indexOf(e.from), t = names.indexOf(e.to);
    if (last && last[0] === f && last[1] === t) return 'last';
    if (taken.some(x => x[0] === f && x[1] === t)) return 'taken';
    return f === cur ? 'open' : 'none';
  };
  const out = [`<defs>` + ['none', 'open', 'taken', 'last'].map(c =>
    `<marker id="arr-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${c === 'last' ? 5 : 7}" markerHeight="${c === 'last' ? 5 : 7}" orient="auto-start-reverse"><path class="ah ${c}" d="M0,0 L10,5 L0,10 z"/></marker>`).join('') + `</defs>`];
  const labels = [];
  edges.forEach(e => {
    const [x1, y1] = pos[e.from], [x2, y2] = pos[e.to], c = edgeClass(e);
    let d, lx, ly, anchor = 'middle', up = true;
    if (e.kind === 'fwd' && e.h === 0) {
      const p = x1 + nodeW(e.from) / 2, q = x2 - nodeW(e.to) / 2 - 3;
      d = `M${p},${y1} L${q},${y2}`; lx = (p + q) / 2; ly = y1 - NH / 2 - 5;   // above the boxes, so a wide label cannot run into them
    } else if (e.kind === 'fwd') {
      const p = x1 + 12, q = x2 - 12, y = y1 - NH / 2;
      d = `M${p},${y} Q${(p + q) / 2},${y - 2 * e.h} ${q},${y - 3}`; lx = (p + q) / 2; ly = y - e.h - 6;
    } else if (e.kind === 'back' && backOnTop) {
      const p = x1 + 6, q = x2 - 6, y = y1 - NH / 2;      // wider than the forward arc it sits over
      d = `M${p},${y} Q${(p + q) / 2},${y - 2 * e.h} ${q},${y - 3}`; lx = (p + q) / 2; ly = y - e.h - 6;
    } else if (e.kind === 'back') {
      const p = x1 - 10, q = x2 + 10, y = y1 + NH / 2;
      d = `M${p},${y} Q${(p + q) / 2},${y + 2 * e.h} ${q},${y + 3}`; lx = (p + q) / 2; ly = y + e.h + 14; up = false;
    } else {                                   // down to a 'violated' state
      const mates = edges.filter(o => o.kind === 'down' && o.to === e.to), n = mates.length, k = mates.indexOf(e);
      const tx = x2 + (k - (n - 1) / 2) * Math.min(46, nodeW(e.to) / (n + 0.5)), ty = y2 - NH / 2 - 3, sy = y1 + NH / 2;
      d = `M${x1},${sy} L${tx},${ty}`;
      lx = x1 + (tx - x1) * 0.45; ly = sy + (ty - sy) * 0.45 + 4; up = false;
      if (x1 <= x2) { anchor = 'end'; lx -= 9; } else { anchor = 'start'; lx += 9; }
    }
    out.push(`<path class="edge ${c}" d="${d}" marker-end="url(#arr-${c})"/>`);
    const live = names.indexOf(e.from) === cur, y0 = up ? ly - (e.lines.length - 1) * LH : ly;
    labels.push(`<text class="elabel ${c}" text-anchor="${anchor}">` + e.lines.map((line, r) =>
      `<tspan x="${lx}" y="${y0 + r * LH}">` + (line.text
        ? `<tspan class="${live && line.any ? (e.conds.some(k => fits(bits, k)) ? 'yes' : 'no') : ''}">${line.text}</tspan>`
        : line.lits.map((lit, q) =>
        (q ? ' ∧ ' : '') + `<tspan class="${live ? (litHolds(lit, bits) ? 'yes' : 'no') : ''}">${litText(lit)}</tspan>`).join('')) + `</tspan>`).join('') + `</text>`);
  });
  const [ix, iy] = pos[names[0]], iw = nodeW(names[0]);
  out.push(`<circle class="init" cx="${ix - iw / 2 - 22}" cy="${iy}" r="4"/><path class="edge open" d="M${ix - iw / 2 - 18},${iy} L${ix - iw / 2 - 3},${iy}" marker-end="url(#arr-open)"/>`);
  names.forEach((s, k) => {
    const [x, y] = pos[s], w = nodeW(s);
    const c = (k === cur ? 'cur ' : visited.has(k) ? 'seen ' : '') + (isBad(s) ? 'bad' : isGood(s) ? 'good' : '');
    out.push(`<rect class="node ${c}" x="${x - w / 2}" y="${y - NH / 2}" width="${w}" height="${NH}" rx="${isBad(s) || isGood(s) ? 15 : 7}"/>`
           + `<text class="nlabel ${c}" x="${x}" y="${y + (a.actions ? -3 : 4)}" text-anchor="middle">${spaced(s)}</text>`
           + (a.actions ? `<text class="nact ${c}" x="${x}" y="${y + 13}" text-anchor="middle">→ ${act(s)}</text>` : ''));
  });
  // a diagram wider than the page is scaled down to fit
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.style.height = H * Math.min(1, (svg.clientWidth || W) / W) + 'px';
  svg.innerHTML = out.join('') + labels.join('');

  // beside the diagram: the rule, the path so far, and what each way out is waiting for
  const moves = a.transitions[names[cur]] || [];
  const first = moves.findIndex(([cond]) => fits(bits, cond));    // transitions are tried in order: this one applies
  const ways = moves.length ? moves.map(([cond, to], k) => `<li>&rarr; <b>${to === names[cur] ? 'stays here' : spaced(to)}</b> `
      + (cond.trim() ? 'when ' + cond.split(' ').map(lit => {
          const ok = litHolds(lit, bits);
          return `<span class="${ok ? 'yes' : 'no'}">${litText(lit)} ${ok ? '✓' : '✗'}</span>`; }).join(' and ') : 'otherwise')
      + (k === first ? ' <b>◀ applies now</b>' : '') + `</li>`).join('')
    : `<li class="muted">Nothing leaves this state.</li>`;
  const path = [[0, null]].concat(taken.map(x => [x[1], x[2]]));
  $('dfaInfo').innerHTML = `<h3>${a.name} (${a.kind})</h3><div>${a.rule}</div>`
    + (a.actions ? `<h3>What the car is doing</h3><div><b>${act(names[cur])}</b>, because the controller is in &ldquo;${spaced(names[cur])}&rdquo;</div>` : '')
    + `<h3>Path so far</h3><div id="dfaPath">` + path.map(([k, t]) =>
        `<a data-t="${t === null ? run.t[0] : t}">${spaced(names[k])} <small>${t === null ? 'start' : t.toFixed(1) + ' s'}</small></a>`).join(' &rarr; ') + `</div>`
    + `<h3>From &ldquo;${spaced(names[cur])}&rdquo;, now</h3><ul>${ways}</ul>`;
}
$('dfaTabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  focus = +b.dataset.k;
  if (!AUT[focus].actions) focusName = AUT[focus].name;     // remembered for the next run
  show();
});
$('dfaInfo').addEventListener('click', e => { const l = e.target.closest('a[data-t]'); if (l) { stop(); go(run.t.indexOf(+l.dataset.t)); } });

const GUTTER = 168, ROW = 19, AXIS = 30, AGAP = 26, AROW = 22;
const autoTop = () => AXIS + P.length * ROW + AGAP;   // where the automaton rows start
function tlGeom(w) { const t0 = run.t[0], t1 = run.t[run.t.length - 1] + DATA.dt; return {t0, t1, X: t => GUTTER + (t - t0) / (t1 - t0) * (w - GUTTER - 10)}; }

function drawTimeline() {
  const [g, w, h] = prep($('tl'), autoTop() + AUT.length * AROW + 6);
  const {t0, t1, X} = tlGeom(w), bits = run.labels[frame];
  g.textBaseline = 'middle';
  // time axis
  g.font = '11px system-ui, sans-serif'; g.fillStyle = css('--muted'); g.textAlign = 'center';
  const span = t1 - t0, step = span > 40 ? 10 : span > 16 ? 5 : 2;
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    g.fillText(t + ' s', X(t), 8);
    g.strokeStyle = css('--grid'); g.lineWidth = 1; g.beginPath(); g.moveTo(X(t), AXIS - 4); g.lineTo(X(t), h - 4); g.stroke();
  }
  // stretches the expectation does not explain
  run.unexplained.forEach(u => { g.fillStyle = css('--warning'); g.globalAlpha = 0.28; g.fillRect(X(u[0]), AXIS - 6, Math.max(2, X(u[1]) - X(u[0])), h - AXIS + 2); g.globalAlpha = 1; });
  // expected start times: a marker on the axis and a dashed line; red if the labels are off by more than allowed
  run.phases.forEach((p, k) => { if (p.at === null) return;
    const x = X(p.at), c = isOff(p) || (p.t === null && !p.optional) ? css('--critical') : css('--ink');
    g.strokeStyle = c; g.lineWidth = 1; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(x, AXIS - 2); g.lineTo(x, autoTop() - AGAP + 2); g.stroke(); g.setLineDash([]);
    g.fillStyle = c; g.beginPath(); g.moveTo(x - 5, AXIS - 9); g.lineTo(x + 5, AXIS - 9); g.lineTo(x, AXIS - 2); g.closePath(); g.fill();
    if (p.t === null) { g.textAlign = 'left'; g.fillText(String(k + 1), x + 3, 21); } });
  // expected phases, numbered as in the side list
  run.phases.forEach((p, k) => { if (p.t === null) return;
    g.strokeStyle = css('--axis'); g.lineWidth = 1; g.beginPath(); g.moveTo(X(p.t), 16); g.lineTo(X(p.t), h - 4); g.stroke();
    g.fillStyle = css('--ink2'); g.textAlign = 'left'; g.fillText(String(k + 1), X(p.t) + 3, 21); });
  // rows
  P.forEach((p, k) => {
    const y = AXIS + k * ROW, live = on(bits, k);
    g.textAlign = 'right'; g.font = (live ? '600 ' : '') + '12px system-ui, sans-serif';
    g.fillStyle = live ? css('--ink') : css('--ink2'); g.fillText(p.name, GUTTER - 10, y + ROW / 2);
    if (k && P[k - 1].group !== p.group) { g.strokeStyle = css('--axis'); g.lineWidth = 1; g.beginPath(); g.moveTo(8, y - 0.5); g.lineTo(w - 6, y - 0.5); g.stroke(); }
    g.fillStyle = groupColor(p.group);
    let s = -1;
    for (let i = 0; i <= run.t.length; i++) {
      const v = i < run.t.length && on(run.labels[i], k);
      if (v && s < 0) s = i;
      if (!v && s >= 0) { const xa = X(run.t[s]), xb = X(run.t[i - 1] + DATA.dt);
        g.beginPath(); g.roundRect(xa, y + 5, Math.max(1.5, xb - xa), ROW - 10, 3); g.fill(); s = -1; }
    }
  });
  // automata: one band per automaton, split wherever its state changes, the state named inside
  const top = autoTop();
  g.font = '11px system-ui, sans-serif'; g.textAlign = 'left'; g.fillStyle = css('--muted');
  g.fillText('AUTOMATA: STATE OVER TIME', 10, top - AGAP / 2 + 2);
  g.strokeStyle = css('--axis'); g.lineWidth = 1; g.beginPath(); g.moveTo(8, top - AGAP + 4.5); g.lineTo(w - 6, top - AGAP + 4.5); g.stroke();
  AUT.forEach((a, k) => {
    const y = top + k * AROW, seq = SEQ[k], now = a.states[seq[frame]];
    const nowBad = a.bad.includes(now);
    g.textAlign = 'right'; g.font = '12px system-ui, sans-serif';
    g.fillStyle = nowBad ? css('--critical') : css('--ink2'); g.fillText(a.name, GUTTER - 10, y + AROW / 2);
    let s = 0;
    for (let i = 1; i <= seq.length; i++) {
      if (i < seq.length && seq[i] === seq[s]) continue;
      const name = a.states[seq[s]], xa = X(run.t[s]), xb = X(run.t[i - 1] + DATA.dt), wd = Math.max(1.5, xb - xa - 1);
      const bad = a.bad.includes(name), good = a.good.includes(name);
      const holding = a.actions && a.actions[name] !== 'go';      // on a controller's band, holding stands out from going
      g.fillStyle = bad ? css('--critical') : good ? css('--good') : holding ? css('--axis') : css('--grid');
      g.beginPath(); g.roundRect(xa, y + 3, wd, AROW - 6, 3); g.fill();
      if (!bad && !good) { g.strokeStyle = css('--axis'); g.lineWidth = 1; g.stroke(); }
      const text = name.replace(/_/g, ' ');
      g.font = '11px system-ui, sans-serif';
      if (g.measureText(text).width + 8 <= wd) {
        g.textAlign = 'center'; g.fillStyle = (bad || good) ? '#ffffff' : css('--ink'); g.fillText(text, xa + wd / 2, y + AROW / 2 + 0.5);
      }
      s = i;
    }
  });
  // cursor
  g.strokeStyle = css('--ink'); g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(run.t[frame]), 14); g.lineTo(X(run.t[frame]), h - 2); g.stroke();
}

function frameAt(ev) {
  const r = $('tl').getBoundingClientRect(), {t0, t1} = tlGeom(r.width);
  const t = t0 + (ev.clientX - r.left - GUTTER) / (r.width - GUTTER - 10) * (t1 - t0);
  const i = Math.max(0, Math.min(run.t.length - 1, Math.round((t - t0) / DATA.dt)));
  const y = ev.clientY - r.top;
  // rows 0..P.length-1 are labels; P.length.. are automata; -1 is neither
  const k = y >= autoTop() ? P.length + Math.floor((y - autoTop()) / AROW)
          : y < AXIS + P.length * ROW ? Math.floor((y - AXIS) / ROW) : -1;
  return [i, k];
}
function go(i) { frame = Math.max(0, Math.min(run.t.length - 1, i)); show(); }
function nextChange(dir) {
  let i = frame;
  if (dir > 0) { i++; while (i < run.t.length - 1 && run.labels[i] === run.labels[i - 1]) i++; }
  else { i--; while (i > 0 && run.labels[i] === run.labels[i - 1]) i--; }
  go(i);
}
function stop() { if (timer) { clearInterval(timer); timer = null; } $('bPlay').innerHTML = '&#9654;'; }
function play() {
  if (timer) return stop();
  if (frame >= run.t.length - 1) frame = 0;
  $('bPlay').innerHTML = '&#10074;&#10074;';
  timer = setInterval(() => { if (frame >= run.t.length - 1) return stop(); go(frame + 1); }, 60);
}

sel.onchange = () => selectRun(+sel.value);
$('slider').oninput = e => { stop(); go(+e.target.value); };
$('bPrev').onclick = () => { stop(); go(frame - 1); };
$('bNext').onclick = () => { stop(); go(frame + 1); };
$('bPrevChange').onclick = () => { stop(); nextChange(-1); };
$('bNextChange').onclick = () => { stop(); nextChange(1); };
$('bPlay').onclick = play;
let dragging = false;
// While editing, the marker of a phase's expected start can be dragged along the axis.
let dragPhase = -1;
function markerAt(ev) {
  if (!editing) return -1;
  const r = $('tl').getBoundingClientRect(), {X} = tlGeom(r.width), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (y < AXIS - 14 || y > AXIS + 4) return -1;
  let best = -1, nearest = 8;
  EXP[run.key].phases.forEach((p, k) => { if (p.at == null) return; const d = Math.abs(X(p.at) - x); if (d < nearest) { nearest = d; best = k; } });
  return best;
}
function timeAt(ev) {
  const r = $('tl').getBoundingClientRect(), {t0, t1} = tlGeom(r.width);
  return clampTime(t0 + (ev.clientX - r.left - GUTTER) / (r.width - GUTTER - 10) * (t1 - t0));
}
$('tl').onmousedown = e => {
  stop();
  dragPhase = markerAt(e);
  if (dragPhase >= 0) { e.preventDefault(); return; }
  dragging = true; go(frameAt(e)[0]);
};
window.addEventListener('mouseup', () => {
  if (dragPhase >= 0) { placeByTime(dragPhase); dragPhase = -1; edited(); }   // one undo step for the whole drag
  dragging = false;
});
$('tl').onmousemove = e => {
  const [i, k] = frameAt(e), tip = $('tip');
  if (dragPhase >= 0) {                     // the replay follows the marker, so you see the moment you are choosing
    const at = timeAt(e);
    EXP[run.key].phases[dragPhase].at = at;
    evaluate(run);
    const box = document.querySelector(`#expEdit input[data-act="at"][data-k="${dragPhase}"]`);
    if (box) box.value = at;
    go(Math.max(0, run.t.findIndex(t => t >= at - 1e-9)));
    return;
  }
  $('tl').style.cursor = markerAt(e) >= 0 ? 'ew-resize' : 'crosshair';
  if (dragging) go(i);
  if (k < 0 || k >= P.length + AUT.length) { tip.style.display = 'none'; return; }
  if (k < P.length) tip.textContent = `${run.t[i].toFixed(1)} s · ${P[k].name} is ${on(run.labels[i], k) ? 'true' : 'false'}`;
  else {
    const a = AUT[k - P.length], st = a.states[SEQ[k - P.length][i]];
    tip.textContent = `${run.t[i].toFixed(1)} s · ${a.name} is in state "${spaced(st)}"` + (a.actions ? `: the car is told to ${spaced(a.actions[st])}` : '');
  }
  tip.style.display = 'block';
  const wrap = $('tlWrap').getBoundingClientRect();
  tip.style.left = Math.min(wrap.width - tip.offsetWidth - 6, e.clientX - wrap.left + 12) + 'px';
  tip.style.top = (e.clientY - wrap.top - 28) + 'px';
};
$('tl').onmouseleave = () => $('tip').style.display = 'none';
window.addEventListener('keydown', e => {
  const typing = e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && ['text', 'number'].includes(e.target.type));
  if ((e.ctrlKey || e.metaKey) && !typing && editing) {      // inside a text box, Ctrl+Z keeps its usual meaning
    if (e.key.toLowerCase() === 'z' && !e.shiftKey) { undo(); e.preventDefault(); return; }
    if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { redo(); e.preventDefault(); return; }
  }
  if (['SELECT', 'INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) return;   // typing or using a control
  if (e.key === 'ArrowRight') { stop(); e.shiftKey ? nextChange(1) : go(frame + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { stop(); e.shiftKey ? nextChange(-1) : go(frame - 1); e.preventDefault(); }
  if (e.key === ' ') { play(); e.preventDefault(); }
});
window.addEventListener('resize', () => show());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => show());
DATA.runs.forEach(evaluate);
refreshOptions();
selectRun(0);
// Served by `python -m semalpha.serve`? Then Save writes the file; otherwise it downloads it.
fetch('api/ping').then(r => r.ok ? r.json() : null).then(a => { if (a && a.ok) { SERVER = true; updateBar(); } }).catch(() => {});
</script>
</body>
